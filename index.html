<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ricettario Gelateria</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3E2A20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ricettario">
<style>
  :root{
    --panna: #FBF6EC;
    --panna-scura: #F0E6D2;
    --cioccolato: #3E2A20;
    --cioccolato-chiaro: #6B4E3D;
    --pistacchio: #6E7F3C;
    --pistacchio-scuro: #4E5B29;
    --lampone: #B23A48;
    --riga: #E4D8C2;
    --ombra: 0 2px 10px rgba(62,42,32,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background: var(--panna);
    color: var(--cioccolato);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  header.top{
    position: sticky; top:0; z-index:10;
    background: var(--cioccolato);
    color: var(--panna);
    padding: 18px 20px 16px;
    box-shadow: var(--ombra);
  }
  .top-row{ display:flex; align-items:center; gap:12px; }
  .brand{
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.3px;
    margin: 0;
    flex: 1;
  }
  .brand small{
    display:block;
    font-weight: 400;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #D8C9B5;
    margin-top: 2px;
  }
  button.back{
    appearance:none; border:none; background: rgba(255,255,255,0.12);
    color: var(--panna); width:40px; height:40px; border-radius:50%;
    font-size:20px; line-height:1; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  button.back:active{ background: rgba(255,255,255,0.25); }

  .search-wrap{ margin-top: 14px; }
  input#searchBox{
    width:100%; padding: 12px 14px; border-radius: 12px; border: none;
    font-size: 16px; background: var(--panna); color: var(--cioccolato);
  }
  input#searchBox::placeholder{ color: #9C8A76; }

  main{ padding: 18px 16px 60px; max-width: 720px; margin: 0 auto; }

  .grid-cat{
    display:grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .cat-card{
    background: #fff; border-radius: 18px; padding: 20px 16px;
    box-shadow: var(--ombra); cursor:pointer; border: 1px solid var(--riga);
    display:flex; flex-direction:column; gap:10px; align-items:flex-start;
    min-height: 118px; justify-content: space-between;
  }
  .cat-card:active{ transform: scale(0.97); }
  .scoop{
    width: 40px; height: 40px; border-radius: 50%;
    box-shadow: inset 0 -6px 10px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.1);
  }
  .cat-name{ font-weight: 700; font-size: 16px; line-height:1.25; }
  .cat-count{ font-size: 12px; color: var(--cioccolato-chiaro); }

  .rec-list{ display:flex; flex-direction:column; gap:10px; }
  .rec-item{
    background:#fff; border-radius: 14px; padding: 15px 16px;
    box-shadow: var(--ombra); border:1px solid var(--riga);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    cursor:pointer;
  }
  .rec-item:active{ background: var(--panna-scura); }
  .rec-item .nome{ font-weight:600; font-size:15.5px; }
  .rec-item .n-ing{ font-size:12px; color: var(--cioccolato-chiaro); margin-top:2px;}
  .chevron{ color: var(--cioccolato-chiaro); font-size: 18px; }

  .rec-title{ font-size: 21px; font-weight: 800; margin: 4px 0 4px; }
  .rec-sub{ font-size:12.5px; color: var(--cioccolato-chiaro); margin-bottom: 18px; text-transform:uppercase; letter-spacing:0.5px;}
  table.ingredienti{ width:100%; border-collapse: collapse; background:#fff; border-radius:14px; overflow:hidden; box-shadow: var(--ombra); }
  table.ingredienti th{
    text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px;
    color: var(--cioccolato-chiaro); padding: 12px 14px; border-bottom:2px solid var(--riga);
  }
  table.ingredienti th.qta, table.ingredienti td.qta{ text-align:right; }
  table.ingredienti td{ padding: 12px 14px; border-bottom: 1px solid var(--riga); font-size: 15px; }
  table.ingredienti tr:last-child td{ border-bottom:none; }
  table.ingredienti td.qta{ font-variant-numeric: tabular-nums; font-weight:600; color: var(--pistacchio-scuro); }

  .extra-block{ background:#fff; border-radius:14px; padding: 16px; box-shadow: var(--ombra); margin-bottom: 14px; }
  .extra-block h4{ margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:0.5px; color:var(--cioccolato-chiaro); }
  .extra-block pre{ white-space: pre-wrap; font-family: inherit; margin:0; font-size:14.5px; line-height:1.5; }
  .autore{ font-size: 12.5px; color: var(--cioccolato-chiaro); margin: -8px 0 16px; }

  .empty{ text-align:center; color: var(--cioccolato-chiaro); padding: 60px 20px; font-size:15px; }
  .search-results-hint{ font-size:12.5px; color: var(--cioccolato-chiaro); margin: 0 2px 12px; }
  .updated{ text-align:center; font-size:11px; color: var(--cioccolato-chiaro); margin-top: 30px; }

  ::selection{ background: var(--pistacchio); color:#fff; }

  .scaler{
    background: #fff;
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--ombra);
    margin-bottom: 18px;
    border: 1px solid var(--riga);
  }
  .scaler-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .scaler-title{
    font-size: 12.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--cioccolato-chiaro);
  }
  .scaler-factor{
    font-size: 12.5px;
    color: var(--cioccolato-chiaro);
    font-variant-numeric: tabular-nums;
  }
  .scaler-body{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .scaler-input-wrap{
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--panna);
    border-radius: 12px;
    border: 1.5px solid var(--riga);
    overflow: hidden;
  }
  .scaler-input-wrap:focus-within{
    border-color: var(--pistacchio);
  }
  .scaler input[type="number"]{
    flex: 1;
    border: none;
    background: transparent;
    padding: 12px 14px;
    font-size: 17px;
    font-weight: 700;
    color: var(--cioccolato);
    font-variant-numeric: tabular-nums;
    outline: none;
    min-width: 0;
  }
  .scaler .unit{
    padding: 0 14px 0 0;
    font-size: 14px;
    color: var(--cioccolato-chiaro);
    font-weight: 500;
  }
  .scaler-btn{
    appearance: none;
    border: none;
    background: var(--cioccolato);
    color: var(--panna);
    width: 44px;
    height: 44px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .scaler-btn:active{
    background: var(--cioccolato-chiaro);
  }
  .scaler-btn-750{
    appearance: none;
    border: 1.5px solid var(--cioccolato);
    background: var(--panna);
    color: var(--cioccolato);
    height: 44px;
    min-width: 44px;
    padding: 0 8px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scaler-btn-750:active{
    background: var(--panna-scura);
  }
  table.ingredienti td.qta.scaled{
    color: var(--pistacchio-scuro);
  }

  /* Checkbox ingredienti */
  table.ingredienti th.check,
  table.ingredienti td.check{
    width: 36px;
    text-align: center;
    padding-left: 10px;
    padding-right: 4px;
  }
  table.ingredienti input.ing-check{
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border: 2px solid var(--cioccolato-chiaro);
    border-radius: 5px;
    background: #fff;
    cursor: pointer;
    vertical-align: middle;
    position: relative;
    margin: 0;
  }
  table.ingredienti input.ing-check:checked{
    background: var(--pistacchio);
    border-color: var(--pistacchio);
  }
  table.ingredienti input.ing-check:checked::after{
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  table.ingredienti tr.checked td:not(.check){
    text-decoration: line-through;
    color: #9C8A76;
  }
  table.ingredienti tr.checked td.qta{
    color: #9C8A76;
  }

  /* Barra di sincronizzazione OneDrive */
  .sync-bar{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:12px;
    padding:9px 12px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    font-size: 12.5px;
    color: var(--panna);
  }
  .sync-bar button{
    appearance:none;
    border:none;
    background: var(--panna);
    color: var(--cioccolato);
    font-size: 12.5px;
    font-weight:600;
    padding: 7px 12px;
    border-radius: 8px;
    cursor:pointer;
    flex-shrink:0;
  }
  .sync-bar button:active{ background: var(--panna-scura); }
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <button class="back" id="btnBack" style="display:none;" onclick="goBack()">‹</button>
    <h1 class="brand" id="pageTitle">Ricettario<small>Gelateria</small></h1>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchBox" placeholder="Cerca una ricetta…" oninput="onSearch(this.value)">
  </div>
  <div class="sync-bar" id="syncBar">
    <span id="syncStatus">Sincronizzazione…</span>
    <button id="syncLoginBtn" type="button" style="display:none;">Accedi</button>
  </div>
</header>

<main id="main"></main>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.7.1/lib/msal-browser.min.js"></script>
<script>
let DATA = null;
let GENERATED_AT = null;

/* ==================== SINCRONIZZAZIONE ONEDRIVE (MSAL) ====================
   L'app legge un file JSON puro da OneDrive tramite Microsoft Graph, dopo
   login con l'account Microsoft. Modifica ONEDRIVE_FILE_PATH se il file
   non è in questo percorso (relativo alla root del tuo OneDrive).
=========================================================================== */
const ONEDRIVE_FILE_PATH = "/MY XLS/ricette.json";
const GRAPH_SCOPES = ["Files.Read"];

const msalConfig = {
  auth: {
    clientId: "d3b59e85-2f03-4bcc-ab6e-947a12294b54",
    authority: "https://login.microsoftonline.com/consumers",
    redirectUri: "https://svauz.github.io/ricettario-gelateria/"
  },
  cache: {
    cacheLocation: "localStorage",
    storeAuthStateInCookie: false
  }
};
const msalInstance = new msal.PublicClientApplication(msalConfig);

function setSyncStatus(text, showBtn, btnLabel, btnHandler){
  const bar = document.getElementById('syncBar');
  const status = document.getElementById('syncStatus');
  const btn = document.getElementById('syncLoginBtn');
  bar.style.display = 'flex';
  status.textContent = text;
  if(showBtn){
    btn.style.display = 'inline-block';
    btn.textContent = btnLabel || 'Accedi';
    btn.onclick = btnHandler || loginAndSync;
  } else {
    btn.style.display = 'none';
  }
}

function hideSyncBar(){
  document.getElementById('syncBar').style.display = 'none';
}

async function getGraphToken(){
  const account = msalInstance.getActiveAccount();
  if(!account) throw new Error('no-account');
  try{
    const res = await msalInstance.acquireTokenSilent({ scopes: GRAPH_SCOPES, account });
    return res.accessToken;
  } catch(e){
    const res = await msalInstance.acquireTokenPopup({ scopes: GRAPH_SCOPES });
    return res.accessToken;
  }
}

async function loadRecipesFromOneDrive(){
  setSyncStatus('Sincronizzazione con OneDrive…', false);
  try{
    const token = await getGraphToken();
    const url = 'https://graph.microsoft.com/v1.0/me/drive/root:' + encodeURI(ONEDRIVE_FILE_PATH) + ':/content';
    const resp = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
    if(!resp.ok){
      let dettaglio = '';
      try{ dettaglio = await resp.text(); }catch(_e){}
      console.error('Risposta Graph non-OK, corpo completo:', dettaglio);
      throw new Error('graph-error-' + resp.status + ' | ' + dettaglio);
    }
    const fresh = await resp.json();
    if(!fresh || !fresh.categories) throw new Error('formato JSON inatteso');
    DATA = fresh;
    hideSyncBar();
    render();
  } catch(e){
    console.error('Sync OneDrive non riuscita:', e);
    setSyncStatus('Dati non aggiornati · sync non riuscita', true, 'Riprova', loadRecipesFromOneDrive);
  }
}

async function loginAndSync(){
  try{
    setSyncStatus('Accesso in corso…', false);
    const result = await msalInstance.loginPopup({ scopes: GRAPH_SCOPES });
    msalInstance.setActiveAccount(result.account);
    await loadRecipesFromOneDrive();
  } catch(e){
    console.error('Login Microsoft fallito:', e);
    setSyncStatus('Accesso non riuscito', true, 'Riprova', loginAndSync);
  }
}

async function initAuth(){
  try{
    await msalInstance.initialize();
    await msalInstance.handleRedirectPromise();
  } catch(e){
    console.error(e);
  }
  const accounts = msalInstance.getAllAccounts();
  if(accounts.length > 0){
    msalInstance.setActiveAccount(accounts[0]);
    await loadRecipesFromOneDrive();
  } else {
    setSyncStatus('Accedi per sincronizzare le ricette', true, 'Accedi con Microsoft', loginAndSync);
  }
}
/* ================== FINE BLOCCO SINCRONIZZAZIONE ONEDRIVE ================== */

const CAT_COLORS = {
  "Creme_Uovo": "#F0D18C",
  "Creme_Cioccolato": "#6B4226",
  "Creme_bianche": "#F5F0E6",
  "Creme_Frutta": "#E8A87C",
  "Sorbetto_Frutta": "#E8607A",
  "Granite": "#8FC1DE",
  "Extra": "#6E7F3C"
};

let view = { screen: "menu", catKey: null, recName: null };
const history = [];

function navigate(newView, push=true){
  if(push) history.push(view);
  view = newView;
  document.getElementById('searchBox').value = "";
  render();
}
function goBack(){
  if(history.length === 0){ navigate({screen:"menu", catKey:null, recName:null}, false); return; }
  view = history.pop();
  render();
}

function findCat(key){ return DATA.categories.find(c => c.key === key); }

function render(){
  const main = document.getElementById('main');
  const backBtn = document.getElementById('btnBack');
  const title = document.getElementById('pageTitle');
  main.innerHTML = "";
  document.getElementById('searchBox').placeholder = "Cerca una ricetta…";

  if(view.screen === "menu"){
    backBtn.style.display = "none";
    title.innerHTML = "Ricettario<small>Gelateria</small>";
    renderMenu(main);
  } else if(view.screen === "categoria"){
    backBtn.style.display = "flex";
    const cat = findCat(view.catKey);
    title.innerHTML = (cat ? cat.label : "") + "<small>Ricette</small>";
    renderCategoria(main, cat);
  } else if(view.screen === "ricetta"){
    backBtn.style.display = "flex";
    const cat = findCat(view.catKey);
    title.innerHTML = "Ricetta<small>" + (cat ? cat.label : "") + "</small>";
    renderRicetta(main, cat, view.recName);
  } else if(view.screen === "ricerca"){
    backBtn.style.display = "flex";
    title.innerHTML = "Ricerca<small>Ricettario</small>";
  }
}

function countOf(cat){
  let n = 0;
  if(cat.ricette) n += cat.ricette.length;
  if(cat.ricette_extra) n += cat.ricette_extra.length;
  return n;
}

function renderMenu(main){
  const grid = document.createElement('div');
  grid.className = 'grid-cat';
  DATA.categories.forEach(cat => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.onclick = () => navigate({screen:"categoria", catKey:cat.key, recName:null});
    const n = countOf(cat);
    card.innerHTML = `
      <div class="scoop" style="background:${CAT_COLORS[cat.key] || '#ccc'}"></div>
      <div>
        <div class="cat-name">${cat.label}</div>
        <div class="cat-count">${n} ricett${n===1?'a':'e'}</div>
      </div>`;
    grid.appendChild(card);
  });
  main.appendChild(grid);

  if(GENERATED_AT){
    const upd = document.createElement('div');
    upd.className = 'updated';
    upd.textContent = "Aggiornato il " + GENERATED_AT;
    main.appendChild(upd);
  }
}

function getRecipeDate(r){
  if(!r.ingredienti) return null;
  const d = r.ingredienti.find(i => (i.ingrediente || "").toLowerCase().trim().startsWith("data:"));
  return (d && d.qta != null && String(d.qta).trim() !== "") ? String(d.qta).trim() : null;
}

function countRealIngredients(r){
  if(!r.ingredienti) return 0;
  return r.ingredienti.filter(i => {
    const n = (i.ingrediente || "").toLowerCase().trim();
    return !n.startsWith("data:") && !n.startsWith("note:") && !n.startsWith("extra:");
  }).length;
}

function renderCategoria(main, cat){
  if(!cat){ main.innerHTML = '<div class="empty">Categoria non trovata</div>'; return; }
  const list = document.createElement('div');
  list.className = 'rec-list';

  // Ricette strutturate (con scalatore)
  if(cat.ricette){
    cat.ricette.forEach(r => {
      const item = document.createElement('div');
      item.className = 'rec-item';
      item.onclick = () => navigate({screen:"ricetta", catKey:cat.key, recName:r.nome});
      const nIng = countRealIngredients(r);
      const data = getRecipeDate(r);
      const meta = data
        ? `${nIng} ingredienti · ${escapeHtml(data)}`
        : `${nIng} ingredienti`;
      item.innerHTML = `<div><div class="nome">${escapeHtml(r.nome)}</div><div class="n-ing">${meta}</div></div><div class="chevron">›</div>`;
      list.appendChild(item);
    });
  }

  // Ricette free-text
  if(cat.ricette_extra){
    cat.ricette_extra.forEach(r => {
      const item = document.createElement('div');
      item.className = 'rec-item';
      item.onclick = () => navigate({screen:"ricetta", catKey:cat.key, recName:r.nome});
      item.innerHTML = `<div><div class="nome">${escapeHtml(r.nome)}</div>${r.autore ? `<div class="n-ing">${escapeHtml(r.autore)}</div>`:''}</div><div class="chevron">›</div>`;
      list.appendChild(item);
    });
  }

  if(list.children.length === 0){
    main.innerHTML = '<div class="empty">Nessuna ricetta in questa categoria</div>';
    return;
  }
  main.appendChild(list);
}

function renderRicetta(main, cat, recName){
  if(!cat){ main.innerHTML = '<div class="empty">Ricetta non trovata</div>'; return; }

  // Prima cerca nelle ricette strutturate (hanno lo scalatore)
  if(cat.ricette){
    const r = cat.ricette.find(x => x.nome === recName);
    if(r){
      const isMeta = (name) => {
        const n = (name || "").toLowerCase().trim();
        return n.startsWith("data:") || n.startsWith("note:") || n.startsWith("extra:");
      };

      const realIngredients = r.ingredienti.filter(i =>
        !isMeta(i.ingrediente) && typeof i.qta === "number" && !isNaN(i.qta)
      );

     const originalTotal = realIngredients.reduce((sum, i) => sum + i.qta, 0);

// === DEFAULT 750 g ===
const DEFAULT_TOTAL = 750;
const initialFactor = originalTotal > 0 ? DEFAULT_TOTAL / originalTotal : 1;
// =====================

const rowsHtml = r.ingredienti.map((i, idx) => {
  const isReal = !isMeta(i.ingrediente) && typeof i.qta === "number" && !isNaN(i.qta);
  let qtaDisplay = "—";
  
  if (isReal) {
    let scaled = i.qta * initialFactor;
    scaled = scaled >= 10 ? Math.round(scaled) : Math.round(scaled * 10) / 10;
    qtaDisplay = scaled;
  } else if (i.qta !== null && i.qta !== undefined) {
    qtaDisplay = i.qta;
  }
  
  // Checkbox solo per ingredienti reali (non meta Data/Note/Extra)
  const checkCell = isReal
    ? `<td class="check"><input type="checkbox" class="ing-check" onchange="toggleIngredient(this)"></td>`
    : `<td class="check"></td>`;
  
  return `<tr data-idx="${idx}" data-original="${isReal ? i.qta : ''}" class="${isReal ? 'scalable' : ''}">
            ${checkCell}
            <td>${escapeHtml(i.ingrediente)}</td>
            <td class="qta">${qtaDisplay}</td>
          </tr>`;
}).join("");

main.innerHTML = `
  <div class="rec-title">${escapeHtml(r.nome)}</div>
  <div class="rec-sub">${escapeHtml(cat.label)}</div>

  <div class="scaler">
    <div class="scaler-header">
      <div class="scaler-title">Quantità totale</div>
      <div class="scaler-factor" id="scaleFactor">× ${initialFactor.toFixed(2)}</div>
    </div>
    <div class="scaler-body">
      <div class="scaler-input-wrap">
        <input type="number" id="qtyInput" min="1" step="1"
               value="${DEFAULT_TOTAL}"
               oninput="scaleRecipe(${originalTotal})">
        <span class="unit">g</span>
      </div>
      <button type="button" class="scaler-btn-750" onclick="add750(${originalTotal})" title="Aggiungi 750 g">🍦🍦</button>
      <button type="button" class="scaler-btn" onclick="resetScale(${originalTotal})" title="Ripristina tutto">↺</button>
    </div>
  </div>

  <table class="ingredienti" id="ingTable">
    <thead><tr><th class="check"></th><th>Ingrediente</th><th class="qta">Q.tà</th></tr></thead>
    <tbody>
      ${rowsHtml}
    </tbody>
  </table>`;
      return;
    }
  }

  // Poi cerca nelle ricette free-text
  if(cat.ricette_extra){
    const r = cat.ricette_extra.find(x => x.nome === recName);
    if(r){
      main.innerHTML = `
        <div class="rec-title">${escapeHtml(r.nome)}</div>
        ${r.autore ? `<div class="autore">${escapeHtml(r.autore)}</div>` : '<div style="margin-bottom:16px"></div>'}
        ${r.ingredienti_testo ? `<div class="extra-block"><h4>Ingredienti</h4><pre>${escapeHtml(r.ingredienti_testo)}</pre></div>` : ''}
        ${r.ricetta_testo ? `<div class="extra-block"><h4>Procedimento</h4><pre>${escapeHtml(r.ricetta_testo)}</pre></div>` : ''}
      `;
      return;
    }
  }

  main.innerHTML = '<div class="empty">Ricetta non trovata</div>';
}

function scaleRecipe(originalTotal){
  const input = document.getElementById("qtyInput");
  if(!input) return;

  let newTotal = parseFloat(input.value);
  if(isNaN(newTotal) || newTotal <= 0) return;

  const factor = newTotal / originalTotal;
  document.getElementById("scaleFactor").textContent = "× " + factor.toFixed(2);

  const rows = document.querySelectorAll("#ingTable tr.scalable");
  rows.forEach(row => {
    const original = parseFloat(row.dataset.original);
    if(isNaN(original)) return;

    let scaled = original * factor;
    scaled = scaled >= 10 ? Math.round(scaled) : Math.round(scaled * 10) / 10;

    const cell = row.querySelector("td.qta");
    cell.textContent = scaled;
    cell.classList.add("scaled");
  });
}

function toggleIngredient(checkbox){
  const row = checkbox.closest("tr");
  if(!row) return;
  if(checkbox.checked){
    row.classList.add("checked");
  } else {
    row.classList.remove("checked");
  }
}

function add750(originalTotal){
  const input = document.getElementById("qtyInput");
  if(input){
    let current = parseFloat(input.value) || 0;
    input.value = current + 750;
    scaleRecipe(originalTotal);
  }
}

function resetScale(originalTotal){
  const input = document.getElementById("qtyInput");
  if(input){
    input.value = 750;
    scaleRecipe(originalTotal);
  }
  // Reset di tutte le spunte e dello stile barrato
  document.querySelectorAll("#ingTable input.ing-check").forEach(cb => {
    cb.checked = false;
  });
  document.querySelectorAll("#ingTable tr.checked").forEach(row => {
    row.classList.remove("checked");
  });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function onSearch(q){
  q = q.trim().toLowerCase();
  if(q.length === 0){
    if(view.screen === "ricerca"){ goBack(); }
    return;
  }
  if(view.screen !== "ricerca"){
    history.push(view);
    view = {screen:"ricerca", catKey:null, recName:null};
    document.getElementById('btnBack').style.display = "flex";
    document.getElementById('pageTitle').innerHTML = "Ricerca<small>Ricettario</small>";
  }
  const main = document.getElementById('main');
  main.innerHTML = "";
  const results = [];
  DATA.categories.forEach(cat => {
    (cat.ricette || []).forEach(r => {
      if(r.nome.toLowerCase().includes(q)) results.push({cat, r});
    });
    (cat.ricette_extra || []).forEach(r => {
      if(r.nome.toLowerCase().includes(q)) results.push({cat, r});
    });
  });
  const hint = document.createElement('div');
  hint.className = 'search-results-hint';
  hint.textContent = results.length + (results.length===1 ? ' risultato' : ' risultati');
  main.appendChild(hint);

  const list = document.createElement('div');
  list.className = 'rec-list';
  results.forEach(({cat, r}) => {
    const item = document.createElement('div');
    item.className = 'rec-item';
    item.onclick = () => {
      document.getElementById('searchBox').value = "";
      navigate({screen:"ricetta", catKey:cat.key, recName:r.nome});
    };
    item.innerHTML = `<div><div class="nome">${escapeHtml(r.nome)}</div><div class="n-ing">${escapeHtml(cat.label)}</div></div><div class="chevron">›</div>`;
    list.appendChild(item);
  });
  main.appendChild(list);
}

initAuth();
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW non registrato:', err));
  });
}
</script>
